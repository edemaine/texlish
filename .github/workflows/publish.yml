name: Publish VS Code extension

on:
  push:
    branches: [main]
    paths: [vscode/package.json]
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check extension version
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$BEFORE" =~ ^0+$ ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous=$(git show "$BEFORE:vscode/package.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          current=$(node -p 'require("./vscode/package.json").version')
          echo "Extension version: $previous -> $current"
          if [[ "$previous" != "$current" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check-version
    if: needs.check-version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and publish extension
        run: pnpm --dir vscode run vsce-publish --oidc
